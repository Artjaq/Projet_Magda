fil_conducteur:
  titre: Un fil conducteur
  texte: Depuis plus de trente ans, Magda coud, tricote et assemble des pièces qui
    traversent les saisons. Chaque vêtement porte la trace d'un geste réfléchi,
    d'un choix de matière attentionné, d'un fil tiré avec soin. Ici, rien n'est
    fait en série. Tout est pensé pour durer.
