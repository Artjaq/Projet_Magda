hero:
  surtitre: Artisanat textile · Suisse romande
  titre: toutauchaudME
  tagline: >-
    est mon atelier de couture où, lors de mes loisirs, je crée des vêtements
    simples et confortables, sans oublier un brin d'élégance et d'originalité;

    c'est dire que c'est fait avec passion et soin !
  bouton: prendre contact
  image: ""
  image_alt: "face à la nature qui m'inspire, je laisse aller mon imagination... "
pieces:
  titre: les vêtements
  sous_titre: >
    chaque pièce est unique et existe en une seule talle; tu ne rencontreras
    personne d'autre habillé comme toi...
fil_conducteur:
  titre: un fil conducteur
  texte: >-
    branché à la mode du moment et a-temporel à la fois

    chic, casual, décontracté... selon les accessoires dont tu l'assortiras et qui feront la différence

    en matière naturelle (lin, coton, laine, soie) pour un toucher agréable et entretien facile...

    tout est pensé pour durer !
  lien_label: "j'ai toujours vu ma mère coudre pour nous confectionner des habits,
    mais c'était par besoin... j'ai de la chance de le faire pour à côté de mes
    divers engagements car j'adore travailler de mes mains et non seulement avec
    ma tête; confectionner des vêtements est une manière de m'exprimer, me faire
    et faire plaisir...  "
  image: ""
