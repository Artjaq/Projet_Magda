processus:
  titre: "Ma démarche est très spontanée... "
  sous_titre: >-
    Une belle matière donne en général quelque chose de beau...

    Et il m'arrive souvent de "détourner" la destination "première" du tissus, car je na'i jamais trop aimé suivre les recettes au pied de la lettre. 
  etapes:
    - titre: "P'tit coup de foudre pour commencer... "
      texte: En voyage qu'escapades, en plus de visiter des lieux, les magasins de
        tissus font désormais partie du programme. J'y entre, je vois un tissus;
        il me plaît et me fait plaisir à toucher, alors j'en achète un bout sans
        encore savoir ce que je vais en faire, et souvent la petite idée de
        départ aboutit à quelque chose de différent. Il repose un moment jusqu'à
        ce que quelqu'un s'y intéresse pour me commander un habit, ou que j'ai
        l'idée irrésistible d'en faire un.
    - titre: La conception
      texte: "Avant de couper la moindre pièce, j'ajuste un patron qui me servira de
        base. celui-ci est souvent inspiré d'un autre  vêtement existant que
        j'aime, mais toujours re-visité. Les formes simples sont mes préférées,
        une valeur sûre. Ensuite, ce sont les détails; poches placées autrement
        que d'habitude, cols, forme de manches, boutonnières... qui font la
        différence.\ 

        \  "
    - titre: La confection
      texte: Après la coupe vient l'assemblage qui est une étape fascinante car tout
        prend enfin forme, mais tout peut encore changer... car c'est l'habit
        qui doit s'adapter au corps et non l'inverse et des  idées naissent
        encore et toujours en court de route; un pli supplémentaire, un arrondi
        à accentuer ou contraire à réduire... Il faut souvent de la souplesse et
        quelques astuces non prévus au départ.Puis, viennent les finitions;
        c'est essentiel. Je les soigne avec la plus grande attention. Une pièce
        n'est prête que lorsqu'elle est "bien finie" dans les moindres détails,
        même dans les endroits que l'on ne voit pas.
