surtitre: La créatrice
titre_page: L'atelier de Magda
image_bio: ""
titre_bio: J'ai presque toujours cousu...
biographie: >-
  ... peut-être parce que j'avais toujours vous ma mère nous coudre des habits
  alors que ce n'était pas son métier à la base. Dans le pays où je vivais, à
  l'époque, c'était une nécessité si on voulais avoir quelque chose de joli à
  porter sur soi. Heureusement les choses ont bien changée depuis...   


  Moi non plus ce n'est pas mon métier dans lequel j'ai toujours travaillé bien plus avec ma tête qu'avec mes mains. Alors que je suis très manuelle ! J'aime toucher les tissus; en regarder un bout et imaginer ce qu'il pourrait devenir en prenant forme, ciseaux et aiguilles aidant. 


  J'ai pris des cours de couture et je me suis lancée dans la confection d'habits simples et confortables pour mes enfants et moi-même. Ja' tâtonne, j'ai fait, j'ai défait, je recommenceçais...


  Jusqu'a ce qu'une amie organise une exposition au Château de La Sarraz, "Balthazar festival", où artistes et artisans de tout genre dévoilent leurs oeuvres au plus grand public que leur entourage le plus proche. elle m'a encouragé à y prendre part avec une série de gilets tout douillets à s'emballer dedans, avec un bon bouquin au coin du feu un soir de bourrasque. D'où le logo "toutauchaudME".  


  Comme les saisons changent sous nos latitudes, et que c'est agréable de varier les plaisirs, j'ai continué à tâtonner et jouer avec des matières et des formes différentes. Jupes, pantalons, robes, blouses, vestes, d'hivers et d'été... il y de quoi faire si on laisse son imagination vagabonder...
