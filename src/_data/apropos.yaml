processus:
  titre: "Ma démarche est très spontanée: "
  sous_titre: >-
    Une belle matière donne en général quelque chose de beau...

    Et il m'arrive souvent de "détourner" la destination "première" du tissus, car je na'i jamais trop aimé suivre les recettes au pied de la lettre. 
  etapes:
    - titre: "P'tit coup de foudre... "
      texte: Je vois un tissus; il me plaît, il me fait plaisir à toucher alors j'en
        achète un bout sans encore vraiment savoir ce que je vais en faire, et
        souvent la petite idée de départ aboutit à quelque chose de très
        différent. Il repose un moment jusqu'à ce que quelqu'un s'y intéresse
        pour me commander un habit, ou que j'ai l'idée irrésistible d'en faire
        un.
    - titre: La conception
      texte: "Avant de couper la moindre pièce, j'ajuste un patron dont je vais me
        servir. Ils sont souvent inspirés d'autres vêtements, mais toujours
        re-visités. Les formes simples sont une valeur sûre; ce sont les détails
        qui font (presque) toujours la différence.\ 

        \  "
    - titre: La confection
      texte: >-
        L'assemblage et une étape fascinante car tout prend enfin forme, mais
        tout peut encore changer... car c'est l'habit qui doit s'adapter au
        corps et non inverse et d'autres idées naissent encore en court de
        route; un pli supplémentaire, un arrondi à accentuer ou contraire à
        réduire; il faut souvent de la souplesse et quelques astuces imprévus.

        Puis, viennent les finitions; c'est essentiel. je les soigne avec la plus grande attention. Une pièce n'est prête que lorsqu'elle est "bien finie" dans les moindres détails, même dans les endroits que l'on ne voit pas.
